packages:
  - '.'
  - packages/*

auditConfig:
  ignoreGhsas:
    - GHSA-8r9q-7v3j-jr4g

overrides:
  # Preserve generated tool schemas matched by native VCR recordings.
  zod: '4.4.3'
  # Preserve the lookup export required by @assistant-ui/core@0.1.17.
  '@assistant-ui/core@0.1.17>@assistant-ui/store': '0.2.9'
  '@assistant-ui/react@0.12.28>@assistant-ui/store': '0.2.9'
  jws: '>=4.0.0'
  qs: '>=6.14.1'
  systeminformation: '>=5.27.14'
  vite: '>=7.1.11'
  tar: '>=7.5.2'
  js-yaml: '>=4.1.1'
  tmp: '>=0.2.4'
  read-yaml-file: 2.1.0
  '@changesets/parse': '>=0.4.2'

allowBuilds:
  '@google/genai': true
  '@pnpm/exe': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  cpu-features: true
  dotenv-mono: true
  esbuild: true
  leveldown: true
  oxc-resolver: true
  protobufjs: true
  ssh2: true
  tldjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - pi-durable-couchdb@0.0.1
